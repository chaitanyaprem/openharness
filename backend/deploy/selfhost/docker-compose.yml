# One homelab box: MongoDB, Redis, and the relay. No Autonomous account.
#
#   cd backend/deploy/selfhost
#   cp backend.env.example backend.env   # set HARNESS_ENROLLMENT_TOKEN
#   docker compose --env-file backend.env up -d --build
#
# The image's default command also starts the billing worker. This file does not.
# That worker calls campaign-api.autonomous.ai. Leave it off.
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - harness-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo
      - --quiet
      - --eval
      - |
        try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - harness-redis:/data

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    env_file:
      - backend.env
    environment:
      DATABASE_URL: mongodb://mongo:27017/harness?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      HARNESS_SELF_HOSTED: "true"
      HARNESS_BILLING_ENABLED: "false"
    command: ["node", "dist/server.js"]
    ports:
      - "8085:8085"
    restart: unless-stopped

volumes:
  harness-mongo:
  harness-redis:
